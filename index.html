<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Save Money - سیو منی</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a1628;--bg2:#0f2040;--bg3:#132847;--bg4:#1a3558;
  --card:#152d4a;--card2:#0e2238;
  --teal:#00c9a7;--teal2:#00e0bb;--tealg:rgba(0,201,167,.18);--tealgs:rgba(0,201,167,.32);
  --red:#ff6b6b;--green:#4ade80;--gold:#f5c842;
  --t1:#e8f4f0;--t2:#b0cfc4;--t3:#7da89a;--tm:#4a7a6a;
  --bdr:rgba(0,201,167,.15);--r:16px;--rs:10px;
  --sh:0 4px 24px rgba(0,0,0,.5);
  --urdu:'Noto Nastaliq Urdu',serif;
}

/* ══════ THEME PALETTES (12) ══════ */
:root[data-theme="teal"]{--teal:#00c9a7;--teal2:#00e0bb;--tealg:rgba(0,201,167,.18);--tealgs:rgba(0,201,167,.32);}
:root[data-theme="ocean"]{--teal:#2fb6e0;--teal2:#6fd4f5;--tealg:rgba(47,182,224,.18);--tealgs:rgba(47,182,224,.32);}
:root[data-theme="indigo"]{--teal:#6366f1;--teal2:#8b8ff7;--tealg:rgba(99,102,241,.18);--tealgs:rgba(99,102,241,.32);}
:root[data-theme="violet"]{--teal:#a855f7;--teal2:#c586fb;--tealg:rgba(168,85,247,.18);--tealgs:rgba(168,85,247,.32);}
:root[data-theme="rose"]{--teal:#f43f9e;--teal2:#fb6fb8;--tealg:rgba(244,63,158,.18);--tealgs:rgba(244,63,158,.32);}
:root[data-theme="crimson"]{--teal:#ef4444;--teal2:#f87171;--tealg:rgba(239,68,68,.18);--tealgs:rgba(239,68,68,.32);}
:root[data-theme="amber"]{--teal:#f5a524;--teal2:#fbc858;--tealg:rgba(245,165,36,.18);--tealgs:rgba(245,165,36,.32);}
:root[data-theme="gold"]{--teal:#d4af37;--teal2:#e9cc6c;--tealg:rgba(212,175,55,.18);--tealgs:rgba(212,175,55,.32);}
:root[data-theme="emerald"]{--teal:#22c55e;--teal2:#5ee092;--tealg:rgba(34,197,94,.18);--tealgs:rgba(34,197,94,.32);}
:root[data-theme="forest"]{--teal:#3f9f5f;--teal2:#6fc98d;--tealg:rgba(63,159,95,.18);--tealgs:rgba(63,159,95,.32);}
:root[data-theme="slate"]{--teal:#64748b;--teal2:#94a3b8;--tealg:rgba(100,116,139,.18);--tealgs:rgba(100,116,139,.32);}
:root[data-theme="copper"]{--teal:#e07856;--teal2:#f0a084;--tealg:rgba(224,120,86,.18);--tealgs:rgba(224,120,86,.32);}

/* ══════ LIGHT MODE ══════ */
:root[data-mode="light"]{
  --bg:#f2f6f5;--bg2:#ffffff;--bg3:#eaf1ef;--bg4:#dde9e6;
  --card:#ffffff;--card2:#f5f9f8;
  --t1:#0e2420;--t2:#365c53;--t3:#5f857b;--tm:#8aaba2;
  --bdr:rgba(10,40,32,.10);
  --sh:0 4px 20px rgba(10,40,32,.08);
}
:root[data-mode="light"] body{background:var(--bg);}
:root[data-mode="light"] .toast{box-shadow:0 4px 20px rgba(10,40,32,.15),0 0 20px var(--tealg);}

/* ══════ 3D / PROFESSIONAL POLISH ══════ */
.card,.net-card,.d-hdr,.con-hero,.con-card,.ci,.txn,.bk-opt,.con-info-card,.sc,.rpt-kpi{
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 26px rgba(0,0,0,.28);
  transition:transform .18s ease,box-shadow .18s ease;
}
:root[data-mode="light"] .card,:root[data-mode="light"] .net-card,:root[data-mode="light"] .d-hdr,
:root[data-mode="light"] .con-hero,:root[data-mode="light"] .con-card,:root[data-mode="light"] .ci,
:root[data-mode="light"] .txn,:root[data-mode="light"] .bk-opt,:root[data-mode="light"] .con-info-card,
:root[data-mode="light"] .sc,:root[data-mode="light"] .rpt-kpi{
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 24px rgba(10,40,32,.10);
}
.ci:active,.bk-opt:active,.con-info-card:active{transform:translateY(1px) scale(.99);}
.btn-p{box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 18px var(--tealgs);transition:transform .15s,box-shadow .15s;}
.btn-p:active{transform:translateY(1px) scale(.98);}
.qbtn,.cb-btn,.cb{transition:transform .15s;}
.net-card{position:relative;overflow:hidden;}
.net-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 0%,rgba(255,255,255,.06),transparent 60%);pointer-events:none;}
.hdr{backdrop-filter:blur(10px);}
.nav{backdrop-filter:blur(10px);}

/* ══════ HEADER TOGGLE BUTTONS ══════ */
.hdr-tool{width:34px;height:34px;border-radius:10px;background:var(--bg3);border:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex-shrink:0;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 4px 10px rgba(0,0,0,.2);}
.hdr-tool:active{transform:scale(.92);border-color:var(--teal);}

/* ══════ THEME PICKER ══════ */
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px;}
.theme-sw{aspect-ratio:1;border-radius:14px;cursor:pointer;position:relative;
  border:2px solid transparent;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 4px 10px rgba(0,0,0,.3);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;transition:.15s;}
.theme-sw.sel{border-color:var(--t1);transform:scale(1.05);}
.theme-sw-chk{font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);}
.mode-tog,.lang-tog{display:flex;gap:8px;margin-bottom:14px;}
.mode-tog .tt,.lang-tog .tt{background:var(--bg3);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--t1);font-family:var(--urdu);direction:rtl;min-height:100vh;overflow-x:hidden;
  line-height:2.05;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;}
html[data-lang="en"] body{line-height:1.5;}
/* Nastaliq needs generous line-height & vertical breathing room to avoid clipped loops/diacritics */
.m-title,.pg-title,.sh-title,.ci-name,.d-name,.con-name,.logo-name,.lock-title{line-height:1.9;}
.badge,.pill,.sbadge,.ni-lb,.ci-lb,.txn-date,.sc-lbl,.con-info-label,.rpt-kpi-lbl,.bk-desc{line-height:1.8;padding-top:1px;}
html[data-lang="en"] .m-title,html[data-lang="en"] .pg-title,html[data-lang="en"] .sh-title,html[data-lang="en"] .ci-name,
html[data-lang="en"] .d-name,html[data-lang="en"] .con-name,html[data-lang="en"] .lock-title,html[data-lang="en"] .badge,
html[data-lang="en"] .pill,html[data-lang="en"] .sbadge,html[data-lang="en"] .ni-lb,html[data-lang="en"] .ci-lb,
html[data-lang="en"] .txn-date,html[data-lang="en"] .sc-lbl,html[data-lang="en"] .con-info-label,html[data-lang="en"] .rpt-kpi-lbl,
html[data-lang="en"] .bk-desc{line-height:1.4;padding-top:0;}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--teal);border-radius:4px}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-bottom:1px solid var(--bdr);
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.4);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--teal),var(--teal2));
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:20px;box-shadow:0 0 16px var(--tealgs);flex-shrink:0;}
.logo-name{font-size:17px;font-weight:700;color:var(--teal2);line-height:1.2;}
.logo-tag{font-size:11px;color:var(--t3);}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--bdr);
  display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 20px rgba(0,0,0,.4);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 2px 6px;cursor:pointer;gap:2px;border-top:2px solid transparent;transition:.2s;}
.ni.on{border-top-color:var(--teal);}
.ni-ic{font-size:18px;}
.ni-lb{font-size:10px;color:var(--t3);}
.ni.on .ni-lb{color:var(--teal2);font-weight:700;}

/* MAIN */
.main{flex:1;padding:14px;padding-bottom:88px;overflow-y:auto;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;box-shadow:var(--sh);}

/* NET BALANCE */
.net-card{background:linear-gradient(135deg,var(--bg3),var(--bg4));border:1px solid var(--teal);
  border-radius:var(--r);padding:18px;margin-bottom:14px;text-align:center;
  box-shadow:0 0 24px var(--tealg),var(--sh);}
.net-lbl{font-size:12px;color:var(--t3);margin-bottom:4px;}
.net-val{font-family:Inter,sans-serif;font-size:32px;font-weight:800;color:var(--teal2);letter-spacing:-1px;}
.net-sub{font-size:11px;color:var(--tm);margin-top:4px;}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.sc{padding:14px;border-radius:var(--rs);border:1px solid var(--bdr);}
.sc.g{background:linear-gradient(135deg,#1a1040,#2a1550);}
.sc.r{background:linear-gradient(135deg,#0a2a1a,#0f3520);}
.sc-lbl{font-size:11px;color:var(--t3);margin-bottom:5px;display:block;}
.sc-val{font-family:Inter,sans-serif;font-size:18px;font-weight:700;}
.sc-val.g{color:var(--red)}.sc-val.r{color:var(--green)}

/* SECTION HDR */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sh-title{font-size:14px;font-weight:700;color:var(--t1);}
.sh-act{font-size:12px;color:var(--teal);cursor:pointer;padding:4px 10px;
  background:var(--tealg);border-radius:8px;border:1px solid var(--tealgs);transition:.2s;}
.sh-act:active{opacity:.7;}

/* CUSTOMER ITEM */
.ci{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rs);
  padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.2s;}
.ci:active{background:var(--bg3);border-color:var(--teal);}
.avatar{width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--teal),#006b5c);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;box-shadow:0 0 10px var(--tealg);}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-meta{font-size:11px;color:var(--t3);}
.ci-amt{text-align:left;flex-shrink:0;}
.ci-val{font-family:Inter,sans-serif;font-size:15px;font-weight:700;}
.ci-val.pos{color:var(--red)}.ci-val.neg{color:var(--green)}
.ci-lb{font-size:11px;color:var(--tm);}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;
  align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(4px);}
.sheet{background:var(--bg2);border-radius:24px 24px 0 0;padding:20px 18px 40px;
  width:100%;max-width:480px;border-top:1px solid var(--bdr);
  box-shadow:0 -8px 40px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto;}
.handle{width:36px;height:4px;background:var(--bg4);border-radius:4px;margin:0 auto 18px;}
.m-title{font-size:16px;font-weight:700;color:var(--t1);text-align:center;margin-bottom:16px;}
.lbl{font-size:12px;color:var(--t3);margin-bottom:5px;display:block;}
.inp{width:100%;padding:11px 13px;background:var(--bg3);border:1px solid var(--bdr);
  border-radius:var(--rs);color:var(--t1);font-family:var(--urdu);font-size:14px;
  outline:none;direction:rtl;margin-bottom:12px;}
.inp:focus{border-color:var(--teal);}
.inp::placeholder{color:var(--tm);}
.inp-ltr{direction:ltr;font-family:Inter,sans-serif;}
.btn-p{width:100%;padding:13px;background:linear-gradient(135deg,var(--teal),#009e85);
  border:none;border-radius:var(--rs);color:#fff;font-family:var(--urdu);font-size:15px;
  font-weight:700;cursor:pointer;box-shadow:0 4px 16px var(--tealgs);margin-top:4px;}
.btn-p:active{opacity:.85;}
.btn-s{width:100%;padding:11px;background:transparent;border:1px solid var(--bdr);
  border-radius:var(--rs);color:var(--t3);font-family:var(--urdu);font-size:14px;
  cursor:pointer;margin-top:8px;}
.type-tog{display:flex;gap:8px;margin-bottom:12px;}
.tt{flex:1;padding:10px;border-radius:var(--rs);border:1px solid var(--bdr);
  background:var(--bg3);color:var(--t3);cursor:pointer;font-family:var(--urdu);font-size:13px;font-weight:600;}
.tt.ag{background:rgba(255,107,107,.12);border-color:var(--red);color:var(--red);}
.tt.ar{background:rgba(74,222,128,.12);border-color:var(--green);color:var(--green);}

/* QUICK BTNS */
.qb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.qbtn{padding:14px 10px;border-radius:var(--rs);border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-family:var(--urdu);font-size:13px;font-weight:600;}
.qbtn.g{background:linear-gradient(135deg,#7c1a1a,#9b2020);color:#ffcccc;}
.qbtn.r{background:linear-gradient(135deg,#0f4a28,#145f33);color:#ccfce0;}
.qbtn:active{opacity:.8;}

/* TXN ITEMS */
.txn{padding:11px 13px;border-radius:var(--rs);border:1px solid var(--bdr);
  background:var(--card2);margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.txn-info{flex:1;}
.txn-date{font-size:11px;color:var(--tm);font-family:Inter,sans-serif;}
.txn-note{font-size:12px;color:var(--t2);margin-top:2px;}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;margin-bottom:2px;display:inline-block;}
.badge.g{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.25);}
.badge.r{background:rgba(74,222,128,.12);color:var(--green);border:1px solid rgba(74,222,128,.25);}
.txn-amt{font-family:Inter,sans-serif;font-size:15px;font-weight:700;flex-shrink:0;}
.txn-amt.g{color:var(--red)}.txn-amt.r{color:var(--green)}
.del-btn{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.25);
  color:var(--red);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:14px;flex-shrink:0;}
.del-btn:active{opacity:.7;}

/* COMM BTNS */
.cbs{display:flex;gap:8px;margin-top:12px;}
.cb{flex:1;padding:10px 6px;border-radius:var(--rs);border:none;
  font-family:var(--urdu);font-size:12px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;}
.cb.sms{background:linear-gradient(135deg,#1a3a6a,#22478a);color:#a0c4ff;}
.cb.wa{background:linear-gradient(135deg,#0a3320,#10472e);color:#a0ffcc;}
.cb:active{opacity:.8;}

/* DETAIL HDR */
.d-hdr{background:linear-gradient(135deg,var(--bg3),var(--bg4));border:1px solid var(--bdr);
  border-radius:var(--r);padding:16px;margin-bottom:14px;}
.d-name{font-size:18px;font-weight:700;color:var(--t1);margin-bottom:3px;}
.d-phone{font-size:12px;color:var(--t3);font-family:Inter,sans-serif;direction:ltr;display:inline-block;}
.pills{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.pill{padding:5px 12px;border-radius:20px;font-family:Inter,sans-serif;font-size:12px;font-weight:700;}
.pill.g{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.25);}
.pill.r{background:rgba(74,222,128,.12);color:var(--green);border:1px solid rgba(74,222,128,.25);}
.pill.t{background:var(--tealg);color:var(--teal2);border:1px solid var(--tealgs);}

/* BACK BTN */
.back{background:var(--bg4);border:1px solid var(--bdr);color:var(--t2);
  padding:7px 13px;border-radius:var(--rs);cursor:pointer;font-size:12px;
  font-family:var(--urdu);display:inline-flex;align-items:center;gap:5px;margin-bottom:14px;}
.back:active{border-color:var(--teal);color:var(--teal);}

/* SEARCH */
.sw{position:relative;margin-bottom:12px;}
.sw-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--tm);}
.srch{width:100%;padding:11px 13px 11px 38px;background:var(--bg3);
  border:1px solid var(--bdr);border-radius:var(--rs);color:var(--t1);
  font-family:var(--urdu);font-size:13px;outline:none;direction:rtl;}
.srch:focus{border-color:var(--teal);}

/* SUMMARY */
.sum-row{display:flex;justify-content:space-between;padding:9px 0;
  border-bottom:1px dashed rgba(0,201,167,.1);font-size:12px;}
.sum-row:last-child{border-bottom:none;}

/* CONTACT */
.con-card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--bdr);
  border-radius:var(--r);padding:22px;text-align:center;margin-bottom:12px;}
.con-av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--teal),#005a4d);
  display:flex;align-items:center;justify-content:center;font-size:32px;
  margin:0 auto 12px;box-shadow:0 0 22px var(--tealgs);}
.con-name{font-size:18px;font-weight:700;color:var(--t1);margin-bottom:3px;}
.con-role{font-size:11px;color:var(--teal2);}
.con-row{display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-radius:var(--rs);background:var(--bg3);border:1px solid var(--bdr);
  margin-bottom:8px;cursor:pointer;}
.con-row:active{border-color:var(--teal);}
.con-ic{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
.con-lb{font-size:11px;color:var(--t3);}
.con-val{font-size:13px;color:var(--t1);font-family:Inter,sans-serif;direction:ltr;}
.con-arrow{font-size:12px;color:var(--teal);margin-right:auto;margin-left:0;}

/* BACKUP */
.bk-opt{padding:14px;border-radius:var(--rs);border:1px solid var(--bdr);
  background:var(--card);margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.bk-opt:active{border-color:var(--teal);background:var(--bg3);}
.bk-ic{font-size:26px;width:46px;height:46px;background:var(--bg3);border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bk-title{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:2px;}
.bk-desc{font-size:11px;color:var(--t3);}

/* CHART */
.chart-box{position:relative;height:190px;margin:8px 0;}

/* REPORTS */
.rpt-period-bar{display:flex;gap:6px;margin-bottom:12px;}
.rpt-pb{flex:1;padding:9px 4px;border-radius:var(--rs);border:1px solid var(--bdr);
  background:var(--bg3);color:var(--t3);cursor:pointer;font-family:var(--urdu);font-size:11px;
  font-weight:600;transition:.2s;}
.rpt-pb.on{background:linear-gradient(135deg,var(--teal),#009e85);color:#fff;border-color:var(--teal);
  box-shadow:0 2px 10px var(--tealgs);}
.rpt-pb:active{opacity:.8;}

.rpt-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.rpt-kpi{padding:12px;border-radius:var(--rs);border:1px solid var(--bdr);text-align:center;}
.rpt-kpi.red{background:linear-gradient(135deg,#2a0a0a,#3a1010);}
.rpt-kpi.green{background:linear-gradient(135deg,#0a2a14,#0f3a1e);}
.rpt-kpi.teal{background:linear-gradient(135deg,#0a1f30,#0f2d45);}
.rpt-kpi.gold{background:linear-gradient(135deg,#2a1f00,#3a2c00);}
.rpt-kpi-icon{font-size:20px;margin-bottom:4px;}
.rpt-kpi-val{font-family:Inter,sans-serif;font-size:13px;font-weight:800;color:var(--t1);line-height:1.2;}
.rpt-kpi-lbl{font-size:11px;color:var(--t3);margin-top:3px;}

.rpt-chart-bar{display:flex;gap:6px;margin-bottom:10px;}
.rpt-cb{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--bdr);
  background:var(--bg3);color:var(--t3);cursor:pointer;font-family:var(--urdu);font-size:11px;transition:.2s;}
.rpt-cb.on{background:var(--teal);color:#003328;font-weight:700;}
.rpt-cb:active{opacity:.8;}

.rpt-chart-title{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:2px;}
.rpt-chart-subtitle{font-size:10px;color:var(--t3);margin-bottom:8px;}
.rpt-chart-box{position:relative;height:200px;}

/* AVATAR PICKER */
.av-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.av-item{font-size:24px;padding:6px;border-radius:10px;cursor:pointer;
  background:var(--bg3);border:1px solid var(--bdr);}
.av-item.sel{background:var(--tealg);border-color:var(--teal);}

/* CHART TABS */
.ctab{display:flex;background:var(--bg3);border-radius:var(--rs);padding:3px;margin-bottom:10px;border:1px solid var(--bdr);gap:3px;}
.ct{flex:1;text-align:center;padding:7px 4px;border-radius:8px;cursor:pointer;
  font-size:12px;color:var(--t3);transition:.2s;font-family:var(--urdu);}
.ct.on{background:var(--teal);color:#003328;font-weight:700;}

/* EMPTY */
.empty{text-align:center;padding:36px 20px;color:var(--t3);}
.empty-ic{font-size:44px;margin-bottom:10px;opacity:.5;}
.empty-tx{font-size:13px;}

/* TOAST */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--teal);
  padding:10px 22px;border-radius:40px;font-size:12px;color:var(--teal2);
  box-shadow:0 4px 20px rgba(0,0,0,.5),0 0 20px var(--tealg);
  z-index:999;white-space:nowrap;animation:tin .3s ease;}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* STATUS BADGE */
.sbadge{font-size:11px;padding:3px 10px;border-radius:20px;
  background:var(--tealg);border:1px solid var(--tealgs);color:var(--teal2);display:inline-block;margin-top:6px;}

.pg-title{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:14px;
  padding-bottom:10px;border-bottom:1px solid var(--bdr);}
.divider{height:1px;background:var(--bdr);margin:14px 0;}
.tip-box{margin-top:14px;padding:13px;background:rgba(0,201,167,.06);
  border-radius:12px;border:1px dashed var(--bdr);font-size:11px;color:var(--t3);line-height:1.8;}

/* CALCULATOR */
.calc-wrap{max-width:420px;margin:0 auto;}
.calc-display{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);

.calc-expr{font-size:13px;color:var(--t3);font-family:Inter,sans-serif;min-height:18px;}
.calc-val{font-family:Inter,sans-serif;font-size:36px;font-weight:700;color:var(--t1);

.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:4px;}
.cb-btn{padding:18px 8px;border-radius:14px;border:none;cursor:pointer;
  font-family:Inter,sans-serif;font-size:20px;font-weight:600;
  background:var(--bg3);color:var(--t1);transition:.15s;border:1px solid var(--bdr);}
.cb-btn:active{transform:scale(.92);opacity:.8;}
.cb-btn.span2{grid-column:span 2;}
.op-btn{background:linear-gradient(135deg,#1a3558,#22478a);color:var(--teal2);}
.eq-btn{background:linear-gradient(135deg,var(--teal),#009e85);color:#fff;font-size:22px;}
.del-c{background:linear-gradient(135deg,#4a1a1a,#7a2020);color:var(--red);}

.con-hero-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.08),transparent 70%);}
.con-hero-sm-logo{position:absolute;top:12px;right:14px;

.con-photo-wrap{width:110px;height:110px;border-radius:50%;margin:0 auto 14px;
  border:3px solid rgba(255,255,255,.3);overflow:hidden;
  box-shadow:0 0 0 4px rgba(255,255,255,.1),0 8px 24px rgba(0,0,0,.4);}
.con-photo{width:100%;height:100%;object-fit:cover;object-position:top center;}
.con-hero-name{font-size:20px;font-weight:800;color:#fff;margin-bottom:4px;

.con-hero-role{font-size:12px;color:rgba(255,255,255,.7);}
.con-info-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rs);

.con-info-card:active{border-color:var(--teal);background:var(--bg3);}
.con-info-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:20px;flex-shrink:0;}
.con-info-label{font-size:11px;color:var(--t3);margin-bottom:2px;}
.con-info-val{font-size:14px;color:var(--t1);font-family:Inter,sans-serif;direction:ltr;font-weight:600;}

/* LOCK SCREEN */
.lock-screen{position:fixed;inset:0;background:var(--bg);z-index:500;

.lock-logo{width:64px;height:64px;border-radius:18px;

.lock-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:270px;}
.lock-key{padding:16px;border-radius:14px;border:1px solid var(--bdr);background:var(--bg3);
  color:var(--t1);font-size:18px;font-family:Inter,sans-serif;cursor:pointer;}
.lock-key:active{background:var(--teal);color:#003328;}

/* ════ CHARTS ════ */
function accentHex(){ return (getComputedStyle(document.documentElement).getPropertyValue('--teal')||'#00c9a7').trim(); }
function accentRgba(a){ const h=accentHex().replace('#',''); const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); return `rgba(${r},${g},${b},${a})`; }
function chartTick(){ return MODE==='light' ? '#5f857b' : '#7da89a'; }
function chartLegend(){ return MODE==='light' ? '#365c53' : '#b0cfc4'; }
function chartGrid(){ return MODE==='light' ? 'rgba(10,40,32,.08)' : 'rgba(0,201,167,.06)'; }
let chartInst = null;
function renderChart(type){
  const box=$('chart-box'); if(!box) return;
  if(chartInst){chartInst.destroy();chartInst=null;}
  const canvas=document.createElement('canvas');
  box.innerHTML=''; box.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  if(type==='bar'){
    const labels=S.customers.map(c=>c.name.split(' ')[0]);
    const gData=S.customers.map(c=>S.transactions.filter(t=>t.cid===c.id&&t.type==='given').reduce((s,t)=>s+t.amount,0));
    const rData=S.customers.map(c=>S.transactions.filter(t=>t.cid===c.id&&t.type==='received').reduce((s,t)=>s+t.amount,0));
    chartInst=new Chart(ctx,{
      type:'bar',
      data:{labels,datasets:[
        {label:T('money_given'),data:gData,backgroundColor:'rgba(255,107,107,.7)',borderColor:'rgba(255,107,107,1)',borderWidth:1,borderRadius:5},
        {label:T('money_received'),data:rData,backgroundColor:'rgba(74,222,128,.7)',borderColor:'rgba(74,222,128,1)',borderWidth:1,borderRadius:5}
      ]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:chartLegend(),font:{size:10},boxWidth:10}}},
        scales:{x:{ticks:{color:chartTick(),font:{size:9}},grid:{color:chartGrid()}},
                y:{ticks:{color:chartTick(),font:{size:9},callback:v=>'₨'+v/1000+'k'},grid:{color:chartGrid()}}}}
    });
  } else {
    const tot_g=S.transactions.filter(t=>t.type==='given').reduce((s,t)=>s+t.amount,0);
    const tot_r=S.transactions.filter(t=>t.type==='received').reduce((s,t)=>s+t.amount,0);
    chartInst=new Chart(ctx,{
      type:'doughnut',
      data:{labels:[T('money_given'),T('money_received')],
        datasets:[{data:[tot_g,tot_r],
          backgroundColor:['rgba(255,107,107,.8)','rgba(74,222,128,.8)'],
          borderColor:['#ff6b6b','#4ade80'],borderWidth:2,hoverOffset:5}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'65%',
        plugins:{legend:{position:'bottom',labels:{color:chartLegend(),font:{size:10},boxWidth:10}}}}
    });
  }
}

    : `Hello ${c.name}, your total outstanding balance is PKR ${net.toLocaleString()}. Please arrange payment - Save Money`);

function shareRecord(cid){
  const c=S.customers.find(x=>x.id===cid); if(!c) return;
  const txns=S.transactions.filter(t=>t.cid===c.id).sort((a,b)=>a.date-b.date);
  const g=txns.filter(t=>t.type==='given').reduce((s,t)=>s+t.amount,0);
  const r=txns.filter(t=>t.type==='received').reduce((s,t)=>s+t.amount,0);
  const net=g-r;

  let text = LANG==='ur' ? `*مکمل ادھار کا حساب - Save Money*\n` : `*Full Ledger Statement - Save Money*\n`;
  text += LANG==='ur' ? `گاہک کا نام: ${c.name}\n` : `Customer Name: ${c.name}\n`;
  if(c.phone) text += LANG==='ur' ? `فون نمبر: ${c.phone}\n` : `Phone: ${c.phone}\n`;
  text += `----------------------------\n`;
  txns.forEach((t, i) => {
    const typeStr = LANG==='ur' ? (t.type === 'given' ? 'دیے' : 'وصول') : (t.type === 'given' ? 'Given' : 'Received');
    text += `${i+1}. [${dtStr(t.date)}] ${typeStr}: ₨${t.amount.toLocaleString()}${t.note ? ' (' + t.note + ')' : ''}\n`;
  });
  text += `----------------------------\n`;
  text += LANG==='ur' ? `کل دیے: ₨${g.toLocaleString()}\n` : `Total Given: ₨${g.toLocaleString()}\n`;
  text += LANG==='ur' ? `کل وصول: ₨${r.toLocaleString()}\n` : `Total Received: ₨${r.toLocaleString()}\n`;
  text += LANG==='ur' ? `*باقی واجب الوصول: ₨${net.toLocaleString()}*\n` : `*Outstanding Balance: ₨${net.toLocaleString()}*\n`;

  if(navigator.share){
    navigator.share({ title: `Record - ${c.name}`, text: text })
      .catch(() => {
        navigator.clipboard.writeText(text);
        showToast(T('record_copied'));
      });
  } else {
    navigator.clipboard.writeText(text);
    showToast(T('record_copied'));
  }
}
function getNet(cid){
  const g=S.transactions.filter(t=>t.cid===cid&&t.type==='given').reduce((s,t)=>s+t.amount,0);
  const r=S.transactions.filter(t=>t.cid===cid&&t.type==='received').reduce((s,t)=>s+t.amount,0);
  return g-r;
}

/* ════ CALCULATOR LOGIC ════ */
function calcPress(k){
  if(k==='C'){
    S.calcExpr='';
    S.calcVal='0';
  } else if(k==='DEL'){
    S.calcExpr=S.calcExpr.slice(0,-1);
    S.calcVal=S.calcExpr||'0';
  } else if(k==='='){
    try{
      let exp=S.calcExpr.replace(/×/g,'*').replace(/÷/g,'/');
      let res=eval(exp);
      S.calcVal=String(res);
      S.calcExpr=String(res);
    }catch(e){
      S.calcVal='Error';
    }
  } else {
    S.calcExpr+=k;
    S.calcVal=S.calcExpr;
  }
  renderCalc();
}

function renderCalc(){
  $('main').innerHTML=`
    <div class="pg-title">${T('calculator')}</div>
    <div class="calc-wrap">
      <div class="calc-display">
        <div class="calc-expr">${esc(S.calcExpr)}</div>
        <div class="calc-val">${esc(S.calcVal)}</div>
      </div>
      <div class="calc-grid">
        <button class="cb-btn del-c" onclick="calcPress('C')">C</button>
        <button class="cb-btn op-btn" onclick="calcPress('÷')">÷</button>

        <button class="cb-btn op-btn" onclick="calcPress('×')">×</button>
        <button class="cb-btn del-c" onclick="calcPress('DEL')">⌫</button>

        <button class="cb-btn" onclick="calcPress('7')">7</button>
        <button class="cb-btn" onclick="calcPress('8')">8</button>

        <button class="cb-btn" onclick="calcPress('9')">9</button>
        <button class="cb-btn op-btn" onclick="calcPress('-')">-</button>

        <button class="cb-btn" onclick="calcPress('4')">4</button>
        <button class="cb-btn" onclick="calcPress('5')">5</button>

        <button class="cb-btn" onclick="calcPress('6')">6</button>

        <button class="cb-btn op-btn" onclick="calcPress('+')">+</button>

        <button class="cb-btn" onclick="calcPress('1')">1</button>
        <button class="cb-btn" onclick="calcPress('2')">2</button>

        <button class="cb-btn" onclick="calcPress('3')">3</button>
        <button class="cb-btn eq-btn" style="grid-row: span 2; height:100%;" onclick="calcPress('=')">=</button>

        <button class="cb-btn span2" onclick="calcPress('0')">0</button>
        <button class="cb-btn" onclick="calcPress('.')">.</button>
      </div>
    </div>
  `;
}

/* ════ BACKUP ════ */
function doBackup(){
  const data={version:1,exportedAt:Date.now(),customers:S.customers,transactions:S.transactions};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`SavePaisa_Backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  save('sp_lastbk',Date.now());
  showToast(T('backup_downloaded')); render();
}
function doRestore(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d.customers||!d.transactions) throw 0;
        S.customers=d.customers; S.transactions=d.transactions;
        persist(); showToast(LANG==='ur'?`بحالی مکمل: ${d.customers.length} گاہک ✓`:`Restore complete: ${d.customers.length} customers ✓`); render();
      }catch(e){ showToast(T('invalid_file')); }
    };
    reader.readAsText(file);
  };
  inp.click();
}
function doCopy(){
  const d=JSON.stringify({version:1,exportedAt:Date.now(),customers:S.customers,transactions:S.transactions});
  navigator.clipboard.writeText(d).then(()=>showToast(T('data_copied'))).catch(()=>showToast(T('copy_failed')));
}

/* ════ RENDER REPORTS ════ */
let rptPeriod = 'monthly';
let rptChartType = 'bar';
let rptCharts = [];

function destroyRptCharts(){
  rptCharts.forEach(c=>{try{c.destroy()}catch(e){}});
  rptCharts=[];
}

function getWeeklyData(){
  const weeks={};
  const now=Date.now();
  for(let i=6;i>=0;i--){
    const wk=(LANG==='ur'?'ہفتہ ':'Week ')+(7-i);
    weeks[wk]={given:0,received:0,label:wk};
  }
  S.transactions.forEach(t=>{
    const age=Math.floor((now-t.date)/(7*86400000));
    if(age>6) return;
    const wk=(LANG==='ur'?'ہفتہ ':'Week ')+(7-age);
    if(!weeks[wk]) return;
    weeks[wk][t.type==='given'?'given':'received']+=t.amount;
  });
  return Object.values(weeks);
}

function getMonthlyData(){
  const months={};
  const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const k=d.toLocaleDateString('en-PK',{month:'short',year:'2-digit'});
    months[k]={given:0,received:0,label:k};
  }
  S.transactions.forEach(t=>{
    const d=new Date(t.date);
    const k=d.toLocaleDateString('en-PK',{month:'short',year:'2-digit'});
    if(months[k]) months[k][t.type==='given'?'given':'received']+=t.amount;
  });
  return Object.values(months);
}

function getYearlyData(){
  const years={};
  const nowY=new Date().getFullYear();
  for(let i=2;i>=0;i--){
    const y=String(nowY-i);
    years[y]={given:0,received:0,label:y};
  }
  S.transactions.forEach(t=>{
    const y=String(new Date(t.date).getFullYear());
    if(years[y]) years[y][t.type==='given'?'given':'received']+=t.amount;
  });
  return Object.values(years);
}

function getPeriodData(){
  if(rptPeriod==='weekly') return getWeeklyData();
  if(rptPeriod==='yearly') return getYearlyData();
  return getMonthlyData();
}

function getPeriodLabel(){
  if(rptPeriod==='weekly') return T('weekly_report_lbl');
  if(rptPeriod==='yearly') return T('yearly_report_lbl');
  return T('monthly_report_lbl');
}

function buildDoughnut(canvasId, tot_g, tot_r){

    data:{labels:['💸 '+T('money_given'),'💰 '+T('money_received'),'📊 '+T('outstanding_balance')],
      datasets:[{data:[tot_g,tot_r,Math.max(net,0)],
        backgroundColor:['rgba(255,107,107,.8)','rgba(74,222,128,.8)',accentRgba(.8)],
        borderColor:['#ff6b6b','#4ade80',accentHex()],
        borderWidth:2,hoverOffset:8}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'60%',
      plugins:{legend:{position:'bottom',labels:{color:chartLegend(),font:{size:10},boxWidth:10,padding:8}}}}
  });
  rptCharts.push(c);
}

function buildCustomerBar(canvasId){
  const el=$(canvasId); if(!el) return;
  const top=S.customers.map(c=>{
    const g=S.transactions.filter(t=>t.cid===c.id&&t.type==='given').reduce((s,t)=>s+t.amount,0);
    const r=S.transactions.filter(t=>t.cid===c.id&&t.type==='received').reduce((s,t)=>s+t.amount,0);
    return {name:c.name.split(' ')[0],net:g-r,given:g,recv:r};
  }).sort((a,b)=>b.net-a.net).slice(0,6);
  const c=new Chart(el.getContext('2d'),{
    type:'bar',
    data:{labels:top.map(x=>x.name),datasets:[
      {label:T('money_given'),data:top.map(x=>x.given),backgroundColor:'rgba(255,107,107,.75)',borderColor:'#ff6b6b',borderWidth:1,borderRadius:5},
      {label:T('money_received'),data:top.map(x=>x.recv),backgroundColor:'rgba(74,222,128,.75)',borderColor:'#4ade80',borderWidth:1,borderRadius:5},
    ]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
      plugins:{legend:{labels:{color:chartLegend(),font:{size:10},boxWidth:10}}},
      scales:{x:{ticks:{color:chartTick(),font:{size:9},callback:v=>'₨'+(v/1000).toFixed(0)+'k'},grid:{color:chartGrid()}},
              y:{ticks:{color:MODE==='light'?'#0e2420':'#e8f4f0',font:{size:10}},grid:{color:chartGrid()}}}}
  });
  rptCharts.push(c);
}

function buildNetLine(canvasId){
  const el=$(canvasId); if(!el) return;
  const data=getMonthlyData();
  let running=0;
  const netLine=data.map(d=>{running+=d.given-d.received;return running;});
  const c=new Chart(el.getContext('2d'),{
    type:'line',
    data:{labels:data.map(d=>d.label),datasets:[{
      label:T('cumulative_outstanding'),data:netLine,
      backgroundColor:accentRgba(.12),borderColor:accentHex(),
      borderWidth:2.5,fill:true,tension:0.4,
      pointBackgroundColor:accentHex(),pointRadius:5,pointHoverRadius:7
    }]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:chartLegend(),font:{size:10},boxWidth:10}}},
      scales:{x:{ticks:{color:chartTick(),font:{size:9}},grid:{color:chartGrid()}},
              y:{ticks:{color:chartTick(),font:{size:9},callback:v=>'₨'+(v/1000).toFixed(0)+'k'},
                 grid:{color:chartGrid()}}}}
  });
  rptCharts.push(c);
}

function renderReports(){
  destroyRptCharts();
  const tot_g=S.transactions.filter(t=>t.type==='given').reduce((s,t)=>s+t.amount,0);
  const tot_r=S.transactions.filter(t=>t.type==='received').reduce((s,t)=>s+t.amount,0);
  const net=tot_g-tot_r;
  const active=S.customers.filter(c=>S.transactions.some(t=>t.cid===c.id)).length;
  const pdata=getPeriodData();
  const pGiven=pdata.reduce((s,d)=>s+d.given,0);
  const pRecv=pdata.reduce((s,d)=>s+d.received,0);
  const topCust=S.customers.map(c=>{
    const g=S.transactions.filter(t=>t.cid===c.id&&t.type==='given').reduce((s,t)=>s+t.amount,0);
    const r=S.transactions.filter(t=>t.cid===c.id&&t.type==='received').reduce((s,t)=>s+t.amount,0);
    return {...c,net:g-r};

  $('main').innerHTML=`
    <div class="pg-title">${T('graphical_report')}</div>
    <div class="rpt-period-bar">

    </div>
    <div class="rpt-kpi-grid">
      <div class="rpt-kpi red">
        <div class="rpt-kpi-icon">💸</div>
        <div class="rpt-kpi-val">${fmtPKR(pGiven)}</div>
        <div class="rpt-kpi-lbl">${T('money_given')}</div>
      </div>
      <div class="rpt-kpi green">
        <div class="rpt-kpi-icon">💰</div>
        <div class="rpt-kpi-val">${fmtPKR(pRecv)}</div>
        <div class="rpt-kpi-lbl">${T('money_received')}</div>
      </div>
      <div class="rpt-kpi teal">
        <div class="rpt-kpi-icon">📊</div>
        <div class="rpt-kpi-val">${fmtPKR(pGiven-pRecv)}</div>
        <div class="rpt-kpi-lbl">${T('net_outstanding')}</div>
      </div>
      <div class="rpt-kpi gold">
        <div class="rpt-kpi-icon">👥</div>
        <div class="rpt-kpi-val">${active}</div>
        <div class="rpt-kpi-lbl">${T('active_customers')}</div>
      </div>
    </div>
    <div class="rpt-chart-bar">
      <button class="rpt-cb${rptChartType==='bar'?' on':''}" onclick="setRptChart('bar')">${T('chart_bar')}</button>
      <button class="rpt-cb${rptChartType==='line'?' on':''}" onclick="setRptChart('line')">${T('chart_line')}</button>
      <button class="rpt-cb${rptChartType==='pie'?' on':''}" onclick="setRptChart('pie')">${T('chart_pie')}</button>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div class="rpt-chart-title">${getPeriodLabel()}</div>
      <div class="rpt-chart-subtitle">${rptPeriod==='weekly'?T('last_49_days'):rptPeriod==='yearly'?T('last_3_years'):T('last_6_months')}</div>
      <div class="rpt-chart-box"><canvas id="rc1"></canvas></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
      <div class="card">
        <div class="rpt-chart-title" style="font-size:11px;">${T('total_ratio')}</div>
        <div class="rpt-chart-box" style="height:160px;"><canvas id="rc2"></canvas></div>
      </div>
      <div class="card">
        <div class="rpt-chart-title" style="font-size:11px;">${T('outstanding_trend')}</div>

      <div class="rpt-chart-box" style="height:220px;"><canvas id="rc4"></canvas></div>
    </div>
    <div class="card" style="margin-bottom:12px;">

      <div class="sum-row"><span>${T('total_customers')}</span><span style="font-family:Inter;color:var(--teal2);font-weight:700;">${S.customers.length}</span></div>
      <div class="sum-row"><span>${T('total_given')}</span><span style="color:var(--red);font-family:Inter;font-weight:700;">${fmtPKR(tot_g)}</span></div>
      <div class="sum-row"><span>${T('total_received')}</span><span style="color:var(--green);font-family:Inter;font-weight:700;">${fmtPKR(tot_r)}</span></div>
      <div class="sum-row"><span>${T('outstanding_balance')}</span><span style="color:var(--teal2);font-family:Inter;font-weight:700;">${fmtPKR(net)}</span></div>
      <div class="sum-row"><span>${T('avg_per_customer')}</span><span style="color:var(--gold);font-family:Inter;font-weight:700;">${fmtPKR(S.customers.length?net/S.customers.length:0)}</span></div>
      ${topCust?`<div class="sum-row"><span>${T('highest_outstanding')}</span><span style="color:var(--red);font-weight:700;">${topCust.name}</span></div>`:''}
    </div>
    <div class="card">
      <div class="rpt-chart-title" style="margin-bottom:10px;">${getPeriodLabel()} - ${LANG==='ur'?'تفصیل':'Details'}</div>
      ${pdata.map(d=>`
        <div class="sum-row">
          <span style="font-family:Inter;font-size:11px;">${d.label}</span>
          <span style="display:flex;gap:6px;font-size:11px;font-family:Inter;">
            <span style="color:var(--red);">↑${fmtPKR(d.given)}</span>
            <span style="color:var(--green);">↓${fmtPKR(d.received)}</span>
          </span>
        </div>`).join('')}
    </div>
  `;

  setTimeout(()=>{
    if(rptChartType==='pie'){
      buildDoughnut('rc1',pGiven,pRecv);
    } else {
      buildBarLine('rc1',pdata,rptChartType);
    }
    buildDoughnut('rc2',tot_g,tot_r);
    buildNetLine('rc3');
    buildCustomerBar('rc4');
  },60);
}

function setRptPeriod(p){ rptPeriod=p; renderReports(); }
function setRptChart(t){ rptChartType=t; renderReports(); }

    `:''}

    <div class="tip-box">💡 <strong style="color:var(--teal2);">${T('tip')}</strong> ${T('security_tip')}</div>
  `;
}

/* ════ EMAIL LOGIN SETUP ════ */
function openEmailLoginSetup(){
  const curEmail=load('sp_auth_email','');
  showModal(`
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="handle"></div>
      <div class="m-title">${T('setup_email_login')}</div>
      <label class="lbl">${T('email_address')}</label>
      <input class="inp inp-ltr" id="set-email" type="email" placeholder="${T('email_ph')}" value="${esc(curEmail)}"/>
      <label class="lbl">${T('password_min4')}</label>
      <input class="inp inp-ltr" id="set-email-pass" type="password" placeholder="••••••"/>
      <button class="btn-p" onclick="saveEmailLogin()">${T('save_btn')}</button>
      <button class="btn-s" onclick="closeModal()">${T('cancel')}</button>
    </div>`);
}
function saveEmailLogin(){
  const email=$('set-email').value.trim();
  const pass=$('set-email-pass').value;
  if(!email||!email.includes('@')){showToast(T('enter_valid_email'));return;}
  if(!pass||pass.length<4){showToast(T('pass_min4'));return;}
  save('sp_auth_method','email'); save('sp_auth_email',email); save('sp_auth_pass',pass);
  save('sp_lock_on',true);
  closeModal(); showToast(T('email_login_saved')); renderSettings();
}

/* ════ PIN LOGIN SETUP ════ */
function openPinSetup(){
  showModal(`
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="handle"></div>
      <div class="m-title">${T('set_pin_title')}</div>
      <label class="lbl">${T('pin_4digit')}</label>
      <input class="inp inp-ltr" id="set-pin" type="tel" maxlength="4" placeholder="1234"/>
      <label class="lbl">${T('pin_reenter')}</label>
      <input class="inp inp-ltr" id="set-pin2" type="tel" maxlength="4" placeholder="1234"/>
      <button class="btn-p" onclick="savePinLogin()">${T('save_btn')}</button>
      <button class="btn-s" onclick="closeModal()">${T('cancel')}</button>
    </div>`);
}
function savePinLogin(){
  const p1=$('set-pin').value.trim(), p2=$('set-pin2').value.trim();
  if(!/^\d{4}$/.test(p1)){showToast(T('pin_must4'));return;}
  if(p1!==p2){showToast(T('pins_mismatch'));return;}
  save('sp_auth_method','pin'); save('sp_auth_pin',p1);
  save('sp_lock_on',true);
  closeModal(); showToast(T('pin_saved')); renderSettings();
}

/* ════ LOCK TOGGLE / REMOVE ════ */
function toggleLock(on){
  const method=load('sp_auth_method',null);
  if(on&&!method){showToast(T('set_email_or_pin_first'));return;}
  save('sp_lock_on',on);
  showToast(on?T('lock_enabled'):T('lock_disabled'));
  renderSettings();
}
function removeAuth(){
  if(!confirm(T('confirm_delete_login'))) return;
  localStorage.removeItem('sp_auth_method');
  localStorage.removeItem('sp_auth_email');
  localStorage.removeItem('sp_auth_pass');
  localStorage.removeItem('sp_auth_pin');
  save('sp_lock_on',false);
  showToast(T('login_removed'));
  renderSettings();
}

/* ════ APP LOCK SCREEN (SHOWN BEFORE APP OPENS) ════ */
let _lockPin='';
function checkAppLock(){
  const lockOn=load('sp_lock_on',false);
  const method=load('sp_auth_method',null);
  if(lockOn&&method){ showLockScreen(method); }
  else{ render(); }
}
function showLockScreen(method){
  document.body.insertAdjacentHTML('beforeend',`
    <div class="lock-screen" id="lock-screen">
      <div class="lock-logo">💰</div>
      <div class="lock-title">Save Money</div>
      <div class="lock-sub">${method==='email'?T('login_continue'):T('pin_continue')}</div>
      ${method==='email'?`
        <input class="inp inp-ltr" id="lock-email" type="email" placeholder="${T('email_lbl')}" style="max-width:270px;" value="${esc(load('sp_auth_email',''))}"/>
        <input class="inp inp-ltr" id="lock-pass" type="password" placeholder="${T('password_min4')}" style="max-width:270px;"/>
        <button class="btn-p" style="max-width:270px;" onclick="tryEmailUnlock()">${T('login_btn')}</button>
      `:`
        <div class="pin-dots" id="lock-dots">${[0,1,2,3].map(()=>'<div class="pin-dot"></div>').join('')}</div>
        <div class="lock-keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="lock-key" onclick="lockKey('${n}')">${n}</button>`).join('')}
          <button class="lock-key" onclick="lockClear()">❌</button>
          <button class="lock-key" onclick="lockKey('0')">0</button>
          <button class="lock-key" onclick="lockSubmit()">✔</button>
        </div>
      `}
      <div class="lock-err" id="lock-err"></div>
    </div>`);
}
function lockKey(n){
  if(_lockPin.length<4){ _lockPin+=n; updateLockDots(); }
  if(_lockPin.length===4) setTimeout(lockSubmit,120);
}
function lockClear(){ _lockPin=''; updateLockDots(); const e=$('lock-err'); if(e) e.textContent=''; }
function updateLockDots(){
  document.querySelectorAll('#lock-dots .pin-dot').forEach((d,i)=>d.classList.toggle('f', i<_lockPin.length));
}
function lockSubmit(){
  const correct=load('sp_auth_pin',null);
  if(_lockPin===correct){
    $('lock-screen').remove(); render();
  }else{
    $('lock-err').textContent=T('wrong_pin');
    _lockPin=''; updateLockDots();
  }
}
function tryEmailUnlock(){
  const e=$('lock-email').value.trim(), p=$('lock-pass').value;
  const savedE=load('sp_auth_email',''), savedP=load('sp_auth_pass','');
  if(e===savedE&&p===savedP){ $('lock-screen').remove(); render(); }
  else{ $('lock-err').textContent=T('wrong_email_pass'); }
}

/* ════ RENDER NAV ════ */
function renderNav(){
  const items=[
    {id:'dashboard',ic:'🏠',lb:T('nav_home')},
    {id:'ledger',ic:'📒',lb:T('nav_ledger')},
    {id:'reports',ic:'📊',lb:T('nav_reports')},
    {id:'calc',ic:'🧮',lb:T('nav_calc')},
    {id:'backup',ic:'☁️',lb:T('nav_backup')},
    {id:'contact',ic:'📞',lb:T('nav_contact')},
    {id:'settings',ic:'⚙️',lb:T('nav_settings')},
  ];
  $('nav').innerHTML=items.map(n=>`
    <div class="ni${S.tab===n.id?' on':''}" onclick="setTab('${n.id}')">
      <span class="ni-ic">${n.ic}</span>
      <span class="ni-lb">${n.lb}</span>
    </div>`).join('');
}

/* ════ MAIN RENDER ════ */
function render(){
  renderNav();
  renderHeaderTools();
  const tag=$('hdr-tagline'); if(tag) tag.textContent = LANG==='ur' ? 'سیو منی · ادھار مینیجر' : 'Save Money · Ledger Manager';
  if(S.tab==='dashboard') renderDashboard();
  else if(S.tab==='ledger' && S.selectedCid) renderDetail();
  else if(S.tab==='ledger') renderLedger();
  else if(S.tab==='reports') renderReports();
  else if(S.tab==='calc') renderCalc();
  else if(S.tab==='backup') renderBackup();
  else if(S.tab==='contact') renderContact();
  else if(S.tab==='settings') renderSettings();
}

// Initial Call
initAppearance();
checkAppLock();
</script>
</body>
</html>
